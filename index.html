<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacetime Curvature Visualization</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
  <script>
    // Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Grid Geometry (representing a slice of spacetime)
    const gridSize = 50;
    const gridSpacing = 0.2;
    const geometry = new THREE.PlaneGeometry(gridSize, gridSize, gridSize, gridSize);

    // Deform the grid to simulate curvature
    const mass = 10; // Adjust for more/less curvature
    const curveFactor = 5; // Adjust for intensity of deformation
    geometry.vertices.forEach(vertex => {
      const distance = Math.sqrt(vertex.x ** 2 + vertex.y ** 2);
      vertex.z = -curveFactor * mass / (distance + 1); // Basic Schwarzschild-like curvature
    });

    // Material and Mesh
    const material = new THREE.MeshBasicMaterial({ color: 0x0077ff, wireframe: true });
    const spacetimeMesh = new THREE.Mesh(geometry, material);
    scene.add(spacetimeMesh);

    // Light (optional, to emphasize curvature)
    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(0, 0, 10);
    scene.add(light);

    // Camera Position
    camera.position.z = 20;

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      spacetimeMesh.rotation.x += 0.005; // Rotate for better view
      spacetimeMesh.rotation.y += 0.005;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
